[package]
name = "cortex-cloud"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OpenAI-compatible HTTP inference server for cortex."

[[bin]]
name = "cortex-server"
path = "src/main.rs"

[features]
default = ["gpu"]
gpu = ["cortex/gpu"]

[dependencies]
cortex = { path = "../cortex" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
# ONNX Runtime binding for the v1 shim runtime
# (project_cortex_v1_shim_api.md). `download-binaries` so the ONNX
# runtime native lib is fetched at build time without requiring a
# system-installed ORT.
ort = { version = "=2.0.0-rc.12", features = ["download-binaries"] }
# base64 for the PUT /v1/shims/{id} JSON envelope
# (`{"manifest":{...},"onnx_base64":"..."}`). Avoids axum-multipart
# dep churn and matches AgentOS's preferred upload shape.
base64 = "0.22"
