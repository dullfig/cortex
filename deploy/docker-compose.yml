# cortex deploy stack (Phase Q): cortex-server behind a Caddy TLS+auth
# proxy. Only Caddy is published; cortex is reachable solely on the
# internal network. Run on a Linux NVIDIA box with the NVIDIA Container
# Toolkit installed.
#
#   cp deploy/.env.example deploy/.env   # fill in secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# Build context is the REPO ROOT (Dockerfile copies the workspace), so
# run compose from the repo root or with the paths below.

services:
  cortex:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: cortex-server:latest
    restart: unless-stopped
    # NO published ports — cortex is private to the compose network.
    # Caddy is the only path in.
    environment:
      CORTEX_PORT: "8100"
      CORTEX_BIND: "0.0.0.0"            # reachable by caddy over the net;
                                        # safe because no host port is published
      CORTEX_MODEL: "${CORTEX_MODEL:-/models/model.gguf}"
      CORTEX_MODEL_URL: "${CORTEX_MODEL_URL:-}"
      CORTEX_MAX_SEQ: "${CORTEX_MAX_SEQ:-4096}"
      CORTEX_ENABLE_RETRIEVE: "${CORTEX_ENABLE_RETRIEVE:-1}"
      CORTEX_ENABLE_POLAR_CACHE: "${CORTEX_ENABLE_POLAR_CACHE:-1}"
      # Vulkan via the NVIDIA toolkit — `graphics` is the load-bearing
      # capability; compute-only makes wgpu find no device.
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "graphics,compute,utility"
    volumes:
      - "${CORTEX_MODELS_DIR:-./models}:/models"
    networks: [edge]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [cortex]
    ports:
      - "443:443"
      - "80:80"            # ACME http-01 challenge when using a domain
    environment:
      CORTEX_DOMAIN: "${CORTEX_DOMAIN:-}"     # blank => internal TLS (bare IP)
      CORTEX_API_KEY: "${CORTEX_API_KEY:?set CORTEX_API_KEY in .env}"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "caddy_data:/data"                     # persisted certs
      - "caddy_config:/config"
    networks: [edge]

networks:
  edge:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
